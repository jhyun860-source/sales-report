<!doctype html>
<html lang="ko">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>매출 일일 보고</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7a3b1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="매출보고" />
    <link rel="apple-touch-icon" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663544956173/iJ7WC357SjYWxzEAX5nDtr/icon-192_34ad05fa.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/index-DCkCQCtD.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-ChIU22ka.css">
  </head>

  <body>
    <div id="root"></div>
    <script>
      // [진단용] JS 에러 발생 시 빈 화면 대신 에러 내용을 화면에 표시
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="padding:20px;font-family:monospace;color:#b00;word-break:break-all;"><b>앱 로딩 에러:</b><br>' +
            (e.message || '') + '<br><small>' + (e.filename || '') + ':' + (e.lineno || '') + '</small></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="padding:20px;font-family:monospace;color:#b00;word-break:break-all;"><b>앱 로딩 에러(Promise):</b><br>' +
            String(e.reason) + '</div>';
        }
      });
    </script>
    <script>
      // 서비스 워커 등록 및 업데이트 감지
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.addEventListener('updatefound', function() {
              var newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', function() {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // 새 버전 설치 완료 - 업데이트 알림 표시
                  if (window.__showUpdateBanner) window.__showUpdateBanner();
                }
              });
            });
          });
        });
      }
    </script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
