[build]
builder = "nixpacks"
buildCommand = "pnpm install && pnpm build"
watchPatterns = ["**"]

[build.nixpacksPlan.phases.setup]
nixPkgs = ["nodejs_20", "nodePackages.pnpm", "caddy"]

[build.nixpacksPlan.phases.install]
cmds = ["pnpm install"]

[build.nixpacksPlan.phases.build]
cmds = ["pnpm build"]

[deploy]
startCommand = "caddy start --config /assets/Caddyfile & sleep 2 && node dist/index.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

